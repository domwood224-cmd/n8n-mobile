name: Build debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # ubuntu-latest runners already ship the Android SDK with licenses accepted
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --console=plain --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: n8n-mobile-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Stage APK to releases/
        run: |
          mkdir -p releases
          cp app/build/outputs/apk/debug/app-debug.apk releases/n8n-mobile-v0.2.0-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases/n8n-mobile-v0.2.0-debug.apk
          git commit -m "Stage v0.2.0 APK for download" || echo "nothing to commit"
          git push origin HEAD:main || echo "push failed"
